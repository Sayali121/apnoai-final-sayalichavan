const fmt=n=>'₹'+(n/10000000).toFixed(2)+' Cr';
const lakh=n=>'₹'+(n/100000).toFixed(2)+' L';
function sum(a,k){return a.reduce((s,r)=>s+Number(r[k]||0),0)}
function group(a,key){const o={};a.forEach(r=>{const k=r[key];o[k]??={sales:0,profit:0,orders:0};o[k].sales+=+r.Sales;o[k].profit+=+r.Profit;o[k].orders++});return o}
function draw(){

 document.getElementById('profit').textContent=lakh(profit);
 document.getElementById('orders').textContent=a.length.toLocaleString();
 document.getElementById('margin').textContent=(sales?profit/sales*100:0).toFixed(2)+'%';
 let g=group(a,'Category'), ks=Object.keys(g).sort((x,y)=>g[y].sales-g[x].sales);

 g=group(a,'Region');ks=Object.keys(g).sort((x,y)=>g[y].profit-g[x].profit);
 Plotly.react('regionChart',[{type:'bar',orientation:'h',y:ks.slice().reverse(),x:ks.slice().reverse().map(k=>g[k].profit/1e5),marker:{color:'#2c9b69'}}],{title:'Profit by Region (₹ lakh)',margin:{t:45,l:70,r:15,b:45},paper_bgcolor:'white',plot_bgcolor:'white',xaxis:{gridcolor:'#e8edf3'}},{responsive:true,displayModeBar:false});
 const m={};a.forEach(r=>{const k=r.Order_Date.slice(0,7);m[k]=(m[k]||0)+ +r.Sales});
 ks=Object.keys(m).sort();
 Plotly.react('trendChart',[{type:'scatter',mode:'lines+markers',x:ks,y:ks.map(k=>m[k]/1e6),line:{width:3,color:'#2878b5'}}],{title:'Monthly Sales Trend (₹ million)',margin:{t:45,l:50,r:15,b:50},paper_bgcolor:'white',plot_bgcolor:'white',yaxis:{gridcolor:'#e8edf3'}},{responsive:true,displayModeBar:false});
 g=group(a,'Customer_Segment');ks=Object.keys(g).sort((x,y)=>g[y].sales-g[x].sales);
 Plotly.react('segmentChart',[{type:'bar',x:ks,y:ks.map(k=>g[k].sales/1e6),marker:{color:'#7b6bb2'}}],{title:'Sales by Customer Segment (₹ million)',margin:{t:45,l:50,r:15,b:80},paper_bgcolor:'white',plot_bgcolor:'white',yaxis:{gridcolor:'#e8edf3'}},{responsive:true,displayModeBar:false});
}
